<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>RUVA HQ</title>
<meta name="theme-color" content="#0B0F14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F4F5F7;--card:#fff;--ink:#11151C;--muted:#5D6675;--line:#E3E6EB;--accent:#2F6BFF;--ok:#0E9F6E;--warn:#B07800;--bad:#E11D48;--sunk:#EEF0F3;--side:#0B0F14;--hover:#F8F9FB;--f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0B0F14;--card:#141A23;--ink:#EEF1F5;--muted:#9AA3B2;--line:#253041;--sunk:#1C2430;--side:#070A0E;--hover:#18202B;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}h1,h2{margin:0;letter-spacing:-.02em}h1{font-size:24px}h2{font-size:21px}p{margin:0}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,Menlo,monospace}.grow{flex:1;min-width:0}.sub{display:block;font-size:12.5px}
.btn{border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-weight:700;background:var(--card);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.dng{color:var(--bad)}.btn:disabled{opacity:.5}
input,select{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 10px;min-width:0}
input:focus,select:focus,.btn:focus-visible,tr:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}.field input,.field select{color:var(--ink);font-weight:500;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.label{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}.pill.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
/* frame: sidebar + main */
.frame{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#E8ECF2;display:flex;flex-direction:column;gap:18px;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:0 6px}.brand b{color:#7FA6FF}
.mark{width:32px;height:32px;border-radius:9px;background:#2F6BFF;display:grid;place-items:center;flex:none}.mark svg{width:19px;height:16px}
.side nav{display:flex;flex-direction:column;gap:2px}.side nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:#AEB6C4;padding:9px 10px;border-radius:9px;font-weight:700;cursor:pointer;text-align:left}
.side nav button svg{width:18px;height:18px}.side nav button:hover{background:rgba(255,255,255,.06);color:#fff}.side nav button[aria-pressed=true]{background:rgba(255,255,255,.1);color:#fff}
.who{display:flex;flex-direction:column;gap:4px;font-size:12.5px;padding:0 6px}.who b{word-break:break-all;font-size:13px}.who .muted{color:#7D8796}.who .btn{margin-top:6px;align-self:flex-start;background:transparent;color:#E8ECF2;border-color:rgba(255,255,255,.18)}
.main{min-width:0;padding:22px 26px 30px;display:flex;flex-direction:column;gap:14px;height:100vh;overflow:hidden}
/* accounts */
.topbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:280px;max-width:640px}.search input{width:100%;padding:11px 12px 11px 40px;font-size:15px;border-radius:11px}
.kbd{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--sunk)}
.kpis{display:flex;gap:8px}.kpis div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 14px;display:flex;flex-direction:column;min-width:88px}.kpis b{font-size:19px;font-variant-numeric:tabular-nums}.kpis span{font-size:11.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.chip span{font-variant-numeric:tabular-nums;opacity:.7;margin-left:2px}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.work.has-sel{grid-template-columns:minmax(380px,.85fr) minmax(560px,1.15fr)}.work:not(.has-sel) .col-detail{display:none}.work:not(.has-sel) .col-list{align-self:start}
.col-list,.col-detail{min-height:0;overflow:auto;border-radius:14px}
.col-list{background:var(--card);border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);z-index:1}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--hover)}.tbl tbody tr.on{background:color-mix(in srgb,var(--accent) 8%,var(--card));box-shadow:inset 3px 0 0 var(--accent)}
.work.has-sel .tbl.acc th:nth-child(5),.work.has-sel .tbl.acc td:nth-child(5),.work.has-sel .tbl.acc th:nth-child(3),.work.has-sel .tbl.acc td:nth-child(3),.work.has-sel .tbl.pro th:nth-child(4),.work.has-sel .tbl.pro td:nth-child(4){display:none}
.empty{padding:60px 20px;text-align:center}
/* detail */
.detail{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}.d-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.cards .card:nth-child(3){grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}.stats div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}.stats b{font-size:20px;font-variant-numeric:tabular-nums}.stats span{font-size:11.5px;color:var(--muted)}
.person{display:grid;grid-template-columns:minmax(200px,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.person.off{opacity:.65}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.inline{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:10px;padding:8px 10px}.inline input{flex:1;min-width:220px}
.log{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}.log .muted{font-size:12.5px}
.inv{background:var(--sunk);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;word-break:break-all}
.back{display:none}
.single{max-width:980px;width:100%;display:flex;flex-direction:column;gap:14px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.auth{max-width:400px;margin:12vh auto 0;align-items:stretch;gap:14px}.logo{width:52px;height:52px;border-radius:14px;background:#2F6BFF;display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* smaller screens: tablet & phone fall back to one column */
@media (max-width:1180px){.work.has-sel{grid-template-columns:minmax(300px,.8fr) minmax(0,1.2fr)}.cards{grid-template-columns:1fr}.kpis{display:none}}
@media (max-width:900px){.frame{grid-template-columns:1fr}.side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 14px;z-index:5;flex-wrap:wrap;gap:10px}.side nav{flex-direction:row}.side nav button svg{display:none}.who{flex-direction:row;align-items:center}.who .muted,.who b{display:none}.who .btn{margin:0}
  .main{height:auto;overflow:visible;padding:14px 16px 30px}.work,.work.has-sel{grid-template-columns:1fr}.col-list,.col-detail{overflow:visible}.work.has-sel .col-list{display:none}.back{display:inline-flex}
  .tbl th:nth-child(5),.tbl td:nth-child(5){display:none}.d-head .grow{flex-basis:100%;order:2}.d-head>.pill{order:3}.grid{grid-template-columns:1fr 1fr}.person{grid-template-columns:1fr}.acts{justify-content:flex-start}}
@media (max-width:560px){.tbl.acc th:nth-child(2),.tbl.acc td:nth-child(2),.tbl.acc th:nth-child(3),.tbl.acc td:nth-child(3),.tbl.pro th:nth-child(3),.tbl.pro td:nth-child(3),.tbl.pro th:nth-child(4),.tbl.pro td:nth-child(4){display:none}}
.hq h1{margin-bottom:2px}.kpis.big{flex-wrap:wrap}.kpis.big div{min-width:120px;padding:10px 16px}.kpis.big b{font-size:24px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.log.click{cursor:pointer;border-radius:8px}.log.click:hover{background:var(--hover)}
.task{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:5px 0}.task input{margin-top:3px;width:17px;height:17px;flex:none}.task-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:4px 0}.task-row:first-of-type{border-top:0}.task-row.done span{text-decoration:line-through;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.dl{display:grid;grid-template-columns:minmax(140px,35%) 1fr;gap:6px 14px;margin:0}.dl dt{color:var(--muted);font-weight:700}.dl dd{margin:0;white-space:pre-wrap}
textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px;font:inherit;color:var(--ink);resize:vertical;width:100%}
.brep{display:flex;flex-direction:column;gap:8px}.brep.done{opacity:.6}.brep select{min-width:150px;flex:1 1 150px}.brep input{flex:3 1 220px;min-width:0}
.nb{margin-left:auto;background:#E11D48;color:#fff;border-radius:99px;font-size:11px;padding:0 7px}.nb:empty{display:none}
.grid.nx{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.main{overflow:auto}main.single{overflow:auto}

/* ---- responsive: computer, iPad, phone ---- */
html,body{overflow-x:hidden}
.tbl{width:100%}
@media (max-width:1180px){.kpis.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.big div{min-width:0}}
@media (max-width:900px){
  .frame{grid-template-columns:minmax(0,1fr)}.side,.main{min-width:0}
  .main{height:auto;overflow:visible;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .side{position:sticky;top:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;height:auto}
  .side .brand{order:1;padding:0}.side .who{order:2;margin-left:auto}.side .grow{display:none}
  .side nav{order:3;width:calc(100% + 28px);min-width:0;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:4px;margin:0 -14px;padding:0 14px 2px;scrollbar-width:none}.side nav::-webkit-scrollbar{display:none}
  .side nav button{white-space:nowrap;padding:8px 12px;flex:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}.chips::-webkit-scrollbar{display:none}.chip{flex:none}
  .topbar{flex-wrap:wrap;gap:10px}.topbar h1{font-size:22px}.search{min-width:0;flex-basis:100%;max-width:none}
  .single{max-width:none;overflow:visible}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.nx{grid-template-columns:1fr}
  .card{padding:14px}.row>input.grow{min-width:0}
  .dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:6px}
  .log{flex-wrap:wrap;gap:4px 10px}
}
@media (max-width:560px){
  h1{font-size:22px}.grid{grid-template-columns:1fr}
  .kpis.big{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row>.btn,.row>select{flex:1 1 auto}
  .task-row{align-items:flex-start}
  .detail .d-head select{width:100%;order:4}
}
</style>
</head>
